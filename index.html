<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="dashboard-header">
        <h1>Everstride</h1>
        <p>One small step at a time leads to a marathon overtime.</p>
    </header>

    <section class="today-focus">
        <h2>Today's Focus</h2>
        <p>Choose three challenges to focus on today.</p>

        <div id="focus-tasks"></div>
    </section>

    <div class="task-toolbar">
        <input type="text" id="task-input" placeholder="Enter a new challenge">
        <button id="add-task">+ Add Task</button>
        <button id="reset-board">Reset Board</button>
    </div>

    <div class="board">
        <div class="column" id="todo-column">
            <h2>To Do</h2>
        </div>

        <div class="column" id="progress-column">
            <h2>In Progress</h2>
        </div>

        <div class="column" id="completed-column">
            <h2>Completed</h2>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
